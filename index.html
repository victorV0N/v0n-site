<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js')</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v0n · Sites que vendem enquanto você atende</title>
<meta name="description" content="Sites e landing pages para negócios que atendem cliente presencialmente. A gente acha o gargalo, faz e te mostra funcionando — só então fala de valor.">
<link rel="icon" href="img/selo.svg">

<!-- Card do link no WhatsApp. SEU-SITE e marca de bloqueio: og:image e og:url
     exigem URL absoluta, e o endereco real so existe quando o site subir. -->
<meta property="og:type" content="website">
<meta property="og:title" content="v0n · Sites que vendem enquanto você atende">
<meta property="og:description" content="A gente acha o gargalo do seu negócio no digital, faz e te mostra funcionando. Só então fala de valor.">
<meta property="og:image" content="https://SEU-SITE.netlify.app/img/og.png">
<meta property="og:url" content="https://SEU-SITE.netlify.app/">
<meta name="twitter:card" content="summary_large_image">

<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"ProfessionalService",
  "name":"v0n",
  "description":"Sites e landing pages para negócios que atendem cliente presencialmente.",
  "url":"https://SEU-SITE.netlify.app/",
  "logo":"https://SEU-SITE.netlify.app/img/logo.svg",
  "areaServed":"BR",
  "founder":{"@type":"Person","name":"Kauã Victor"},
  "telephone":"+55contato-pendente"
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;700&family=Inter:wght@300;400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<!-- Abertura. Esquema medido no styles.css do mazyos.com.br: batida unica,
     palavra entrando de +40% e saindo pra -40%. A copy e a unica coisa que
     muda quando o Kaua quiser outra - esta toda aqui.

     A logo vem inline (e nao <img src="img/logo.svg">) porque cada peca
     entra na sua vez: dentro de um <img> o SVG e uma imagem so, sem peca
     pra animar. As pecas sao as mesmas do arquivo; o 0 e o N ganharam um
     <g> em volta porque o translate deles era atributo, e transform de CSS
     substitui o atributo em vez de somar - o 0 cairia em cima do V.

     No fim a logo voa ate a do cabecalho; o calculo esta no site.js. -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="intro__palco">
    <span class="intro__frase">
      <span class="intro__fixo">MAIS</span>
      <span class="intro__palavras">
        <span class="intro__palavra">CLAREZA.</span>
        <span class="intro__palavra">FORMA.</span>
        <span class="intro__palavra">PRESENÇA.</span>
      </span>
    </span>
    <svg class="intro__logo" viewBox="0 0 320 128" width="320" height="128">
      <path class="intro__peca intro__peca--v" d="M0 28 L20 28 L40 78 L60 28 L80 28 L40 128 Z"/>
      <g transform="translate(98,0)"><path class="intro__peca intro__peca--o" fill-rule="evenodd" d="M0 28 L60 28 L88 56 L88 128 L28 128 L0 100 Z M20 48 L51.7 48 L68 64.3 L68 108 L36.3 108 L20 91.7 Z"/></g>
      <g transform="translate(204,0)"><path class="intro__peca intro__peca--n" d="M0 128 L0 28 L20 28 L60 96 L60 20 L80 0 L80 128 L60 128 L20 60 L20 128 Z"/></g>
      <rect class="intro__peca intro__peca--ponto" x="300" y="108" width="20" height="20"/>
    </svg>
  </div>
</div>

<header class="topo">
  <div class="topo__barra env">
    <a class="topo__logo" href="index.html" aria-label="v0n — início">
      <img src="img/logo.svg" width="140" height="56" alt="v0n">
    </a>
  </div>
</header>
<main>
  <section class="hero">
    <div class="env hero__grade">
      <div class="hero__conteudo">
        <p class="rotulo rotulo--grande entra-fade" style="--i:0">Agência de webdesign e automações</p>
        <h1 class="t1 entra" style="--i:1">Quem te procura consegue te <span class="t1__marca">ver?</span></h1>
        <p class="hero__texto entra" style="--i:2">Sites e landing pages para negócios que atendem cliente no presencial.</p>
      </div>
      <!-- Decorativa: o recado esta no titulo, a foto so da clima. O fundo
           preto dela e o mesmo #000 da pagina, entao ela nao tem moldura. -->
      <!-- Os dois brilhos ficam por cima da estrela que ja existe na arte e
           pulsam em CSS. Moram junto da foto no .hero__olhos pra descerem
           com ela no parallax. -->
      <div class="hero__foto entra-fade" aria-hidden="true">
        <div class="hero__olhos">
          <img src="img/olhos.jpg" width="736" height="736" alt="">
          <span class="hero__brilho"></span>
          <span class="hero__brilho hero__brilho--dir"></span>
        </div>
      </div>
    </div>
  </section>
</main>
<footer class="rodape">
  <div class="env rodape__conteudo">
    <img class="rodape__logo entra-fade" src="img/logo-mono.svg" width="120" height="54" alt="v0n">
    <p class="rodape__assinatura entra-fade" style="--i:1">— v0n · sites e landing pages</p>
    <p class="rodape__ano entra-fade" style="--i:2">© 2026</p>
  </div>
</footer>
<!-- Rolagem suave: o mesmo Lenis, na mesma versao, que o hermes-agent usa.
     defer nos dois mantem a ordem: o Lenis existe quando o site.js roda. -->
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.23/dist/lenis.min.js" defer></script>
<script src="js/site.js" defer></script>
</body>
</html>
