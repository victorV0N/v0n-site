<!doctype html>
<!-- Fonte do img/og.png. Não é página do site e não entra no sitemap.
     Exportar com:
     chrome --headless=new --disable-gpu --screenshot=img/og.png \
            --window-size=1200,630 --hide-scrollbars \
            http://localhost:4173/img/og.html
     Sem --default-background-color: transparência num card de WhatsApp
     vira fundo branco na conversa, e o card é carbono de propósito. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>og · v0n</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  *{box-sizing:border-box}
  body{
    margin:0; width:1200px; height:630px; overflow:hidden;
    background:#121317; color:#ECEDE8;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:72px 80px;
  }
  .marca{height:64px; width:auto; align-self:flex-start}
  .rotulo{
    font:500 20px/1 'IBM Plex Mono', monospace;
    text-transform:uppercase; letter-spacing:.09em; color:#8C96A3; margin:0;
  }
  h1{
    font:200 108px/1 'Barlow Condensed', sans-serif;
    text-transform:uppercase; letter-spacing:-.02em; margin:24px 0 0; max-width:15ch;
  }
  .ouro{color:#FFC531}
  .regua{height:3px; background:#FFC531; width:120px}
</style>
</head>
<body>
  <img class="marca" src="logo.svg" alt="v0n">
  <div>
    <div class="regua"></div>
    <h1>Sites que <span class="ouro">vendem</span> enquanto você atende</h1>
  </div>
  <p class="rotulo">v0n · sites e landing pages · Brasil, remoto</p>
</body>
</html>
