<!doctype html>
<!--
  Ferramenta de medicao da abertura. NAO vai pro ar.
  http://localhost:4173/_fases.html

  Congela a mesma pagina em varios instantes da abertura de uma vez. Nao
  espera o relogio: pausa as animacoes e busca o instante com a Web
  Animations API (a.currentTime), que ja leva o animation-delay em conta.
  Esperar tempo real nao funciona aqui - o print do headless sai antes, e
  --virtual-time-budget trava porque o dev.js injeta um EventSource que
  nunca fecha.
-->
<meta charset="utf-8">
<title>fases da abertura · v0n</title>
<style>
  body{margin:0;background:#2A2D35;font:11px/1.3 ui-monospace,monospace;color:#ECEDE8}
  .fila{display:flex;flex-wrap:wrap;gap:10px;padding:10px}
  figure{margin:0}
  figcaption{padding:3px 0;color:#FFC531}
  iframe{border:0;background:#121317}
</style>
<div class="fila" id="fila"></div>
<script>
  // Instantes em segundos. Com --batida 1.25s: as 3 palavras giram ate 3.85,
  // o 0 entra em 3.94, o V em 4.31, o N em 4.50, o quadrado em 4.81 e o
  // overlay comeca a sair em 5.63.
  var instantes = (new URLSearchParams(location.search).get('t') || '0.6,1.9,3.1,4.1,4.6,5.3')
    .split(',').map(Number)

  var largura = Number(new URLSearchParams(location.search).get('w')) || 420
  var altura = Number(new URLSearchParams(location.search).get('h')) || 240

  var fila = document.getElementById('fila')

  // Um iframe por vez: seis carregando juntos disputam CPU e o seek sai
  // antes de a fonte assentar, o que muda a largura da frase no print.
  function proximo (i) {
    if (i >= instantes.length) { document.title = 'pronto · fases'; return }
    var t = instantes[i]

    var fig = document.createElement('figure')
    var cap = document.createElement('figcaption')
    cap.textContent = t + 's'
    var quadro = document.createElement('iframe')
    quadro.width = largura
    quadro.height = altura
    fig.appendChild(cap)
    fig.appendChild(quadro)
    fila.appendChild(fig)

    quadro.addEventListener('load', function () {
      var doc = quadro.contentDocument
      doc.getAnimations().forEach(function (a) {
        a.pause()
        a.currentTime = t * 1000
      })
      proximo(i + 1)
    })
    quadro.src = '/'
  }

  proximo(0)
</script>
