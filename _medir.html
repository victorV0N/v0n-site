<!doctype html>
<!--
  Regua de medicao. NAO vai pro ar - nao entra no sitemap e nao e pagina
  do site. Abrir pelo dev.js: http://localhost:4173/_medir.html?w=360

  Por que existe: o Chrome no Windows tem largura minima de janela, e
  --window-size=360 entrega um viewport de 504px. Todo print "a 360px"
  tirado direto era um recorte de 504 - inclusive os da v1. Um <iframe>
  de largura exata nao tem esse piso, entao e ele que mede.

  ?w=<largura>  largura do iframe em px  (padrao 360)
  ?p=<caminho>  pagina a medir           (padrao /)

  O relato no topo diz se algo estoura a largura e quem e o culpado.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Régua da v0n</title>
<style>
  body{margin:0; background:#2A2D35; font:12px/1.4 ui-monospace, monospace}
  #relato{background:#ECEDE8; color:#121317; padding:8px 10px; white-space:pre-wrap; word-break:break-word}
  #relato.ruim{background:#FFC531}
  iframe{display:block; border:0; background:#121317}
</style>
</head>
<body>
<div id="relato">medindo…</div>
<iframe id="alvo" title="página medida"></iframe>
<script>
(function () {
  var busca = new URLSearchParams(location.search)
  var largura = Number(busca.get('w')) || 360
  var altura = Number(busca.get('h')) || 2400
  var pagina = busca.get('p') || '/'

  var alvo = document.getElementById('alvo')
  var relato = document.getElementById('relato')

  alvo.width = largura
  alvo.height = altura
  alvo.src = pagina

  alvo.addEventListener('load', function () {
    var doc = alvo.contentDocument
    var d = doc.documentElement
    var estoura = d.scrollWidth > d.clientWidth + 1
    var culpados = []

    var todos = doc.querySelectorAll('body *')
    for (var i = 0; i < todos.length; i++) {
      var r = todos[i].getBoundingClientRect()
      if (r.right > d.clientWidth + 1) {
        culpados.push(todos[i].tagName + '.' + String(todos[i].className || '-').slice(0, 24) +
                      ' w' + Math.round(r.width) + ' r' + Math.round(r.right))
      }
    }

    // ?clique=nao,nao,sim responde o Diagnostico antes de medir. E o unico
    // jeito de testar a interacao num print, que nao clica sozinho.
    var clique = busca.get('clique')
    if (clique) {
      clique.split(',').forEach(function (resposta, i) {
        var botao = doc.querySelector('.diag__opcao[data-p="' + i + '"][data-r="' + resposta.trim() + '"]')
        if (botao) botao.click()
      })
    }

    // Relata na hora e de novo depois: o print do Chrome headless sai antes
    // de qualquer setTimeout longo, e relato que nao aparece no print nao
    // mede nada.
    function relatar () {
      var alvos = doc.querySelectorAll('.entra, .entra-fade, .entra-regua')
      var prontos = doc.querySelectorAll('.entra.visivel, .entra-fade.visivel, .entra-regua.visivel')

      // Ouro por dobra. Nao conta .btn--ouro: abaixo de 720px o CTA do hero
      // fica ouro por media query, sem a classe. O que vale e a cor de fundo
      // computada de verdade. Dobra = faixa de 900px de altura da pagina.
      var OURO = 'rgb(255, 197, 49)'
      var dobras = []
      var botoes = doc.querySelectorAll('.btn')
      for (var b = 0; b < botoes.length; b++) {
        // display:none ainda devolve a cor computada. Sem este filtro, o CTA
        // do topo dentro do menu fechado conta como ouro visivel na tela.
        if (!botoes[b].getClientRects().length) continue
        if (doc.defaultView.getComputedStyle(botoes[b]).backgroundColor !== OURO) continue
        var topo = botoes[b].getBoundingClientRect().top + (doc.documentElement.scrollTop || 0)
        var faixa = Math.floor(topo / 900)
        dobras[faixa] = (dobras[faixa] || 0) + 1
      }
      var pior = 0
      for (var f = 0; f < dobras.length; f++) if ((dobras[f] || 0) > pior) pior = dobras[f]

      var ruim = estoura || pior > 1
      relato.className = ruim ? 'ruim' : ''
      relato.textContent = largura + 'px  ·  scroll=' + d.scrollWidth + ' client=' + d.clientWidth +
        ' altura=' + d.scrollHeight + '  ·  ' +
        (estoura ? 'ESTOURA >> ' + culpados.slice(0, 5).join('  //  ') : 'sem rolagem horizontal') +
        // A contagem de entrada tem dois jeitos de mentir, e os dois dao zero:
        // 1) com root nulo o IntersectionObserver mede contra a viewport do
        //    documento de TOPO, nao a do iframe - a janela do Chrome precisa
        //    ser tao alta quanto o iframe, senao nada intersecta nunca;
        // 2) a entrada so liga quando a abertura acaba (5 batidas), e este
        //    relato sai aos 400ms.
        // Zero aqui nao e prova de nada. Quem prova e o print no relogio de
        // verdade, com a pagina inteira na janela.
        '  ·  entrada: ' + prontos.length + '/' + alvos.length +
        (window.innerHeight < altura ? ' (janela baixa, nao vale)'
          : (alvos.length && !prontos.length ? ' (cedo demais, nao vale)' : '')) +
        '  ·  ouro por dobra de 900px: [' + dobras.join(',') + '] max=' + pior +
        (pior > 1 ? '  << DOIS OUROS NA MESMA DOBRA' : '')
    }

    relatar()
    setTimeout(relatar, 400)
    setTimeout(relatar, 1200)
  })
})()
</script>
</body>
</html>
